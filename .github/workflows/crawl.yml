name: crawl

on:
  schedule:
    # Daily at 06:17 UTC (02:17 EDT): off-peak for Ottawa sources.
    - cron: "17 6 * * *"
  workflow_dispatch:

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Ingest, then detail pages, then enrich, all --strict: any
      # source error or failed event fails the run loudly (exit 1)
      # instead of going green.
      # Politeness lives in code, not config: robots.txt + crawl delays
      # honored, at most one request per 3 seconds per host, identifiable
      # User-Agent with the contact URL below, 403/login walls never
      # bypassed (see worker/src/ingest/fetcher.ts).
      - name: Ingest
        run: npm run ingest --workspace @seatpop/worker -- --strict
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          MODEL_API_KEY: ${{ secrets.MODEL_API_KEY }}
          BASETEN_API_KEY: ${{ secrets.BASETEN_API_KEY }}
          LLM_MAX_USD_TOTAL: ${{ secrets.LLM_MAX_USD_TOTAL }}
          LLM_MAX_USD_DAILY_LIVE: ${{ secrets.LLM_MAX_USD_DAILY_LIVE }}
          BASETEN_MAX_USD_TOTAL: ${{ secrets.BASETEN_MAX_USD_TOTAL }}
          INGEST_CONTACT_URL: https://github.com/${{ github.repository }}
      - name: Detail pages
        run: npm run detail-enrich --workspace @seatpop/worker -- --strict
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          MODEL_API_KEY: ${{ secrets.MODEL_API_KEY }}
          BASETEN_API_KEY: ${{ secrets.BASETEN_API_KEY }}
          LLM_MAX_USD_TOTAL: ${{ secrets.LLM_MAX_USD_TOTAL }}
          LLM_MAX_USD_DAILY_LIVE: ${{ secrets.LLM_MAX_USD_DAILY_LIVE }}
          BASETEN_MAX_USD_TOTAL: ${{ secrets.BASETEN_MAX_USD_TOTAL }}
          INGEST_CONTACT_URL: https://github.com/${{ github.repository }}
      - name: Enrich
        run: npm run enrich --workspace @seatpop/worker -- --strict
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          MODEL_API_KEY: ${{ secrets.MODEL_API_KEY }}
          BASETEN_API_KEY: ${{ secrets.BASETEN_API_KEY }}
          LLM_MAX_USD_TOTAL: ${{ secrets.LLM_MAX_USD_TOTAL }}
          LLM_MAX_USD_DAILY_LIVE: ${{ secrets.LLM_MAX_USD_DAILY_LIVE }}
          BASETEN_MAX_USD_TOTAL: ${{ secrets.BASETEN_MAX_USD_TOTAL }}
